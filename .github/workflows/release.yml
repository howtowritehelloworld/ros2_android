name: Release Build & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: |
          cd rosdroid_app
          chmod +x gradlew

      - name: Build Debug & Unsigned Release APKs
        run: |
          cd rosdroid_app
          ./gradlew assembleDebug

      - name: Package Release Assets
        run: |
          TAG_NAME="${{ github.ref_name }}"
          mkdir -p release_assets
          cp rosdroid_app/app/build/outputs/apk/debug/app-debug.apk "release_assets/rosdroid-${TAG_NAME}.apk"
          cd release_assets
          sha256sum "rosdroid-${TAG_NAME}.apk" > "rosdroid-${TAG_NAME}.sha256"
          cat "rosdroid-${TAG_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*.apk
            release_assets/*.sha256
          name: "Rosdroid Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🤖 Rosdroid Release ${{ github.ref_name }}
            
            Welcome to the official release of **Rosdroid: Headless ROS 2 Android Platform**!
            
            ### 🌟 Key Highlights
            - **ROS 2 Lyrical Luth**: Pre-configured with Fast DDS 3 (`rmw_fastrtps_cpp`).
            - **Headless Ubuntu Server 26.04 (Resolute)**: Zero VNC/GUI bloat for maximum RAM and CPU efficiency.
            - **Dropbear SSH Server**: Development user (`robot:rosdroid` on port 2222) and admin user (`root:rosdroid` on port 2224).
            - **Real-Time Sensor Hub**: 9-DOF IMU fused with native C++ Madgwick filter (`/imu/data`), dual hardware cameras (`/camera/*`), battery telemetry (`/battery`), physical LED torch control (`/torch`), and GPS (`/gps`).
            - **Micro-ROS USB-C Bridge**: Direct OTG serial relay to ESP32 / STM32 motor controllers (`micro_ros_agent` UDP 8888).
            - **In-App Neon Green Console**: Embedded PRoot terminal with 1-tap action chips.
            
            ### 📥 Installation
            Download `rosdroid-${{ github.ref_name }}.apk` below and install directly onto your `arm64-v8a` Android smartphone.

            The in-app installer downloads `rosdroid-ubuntu26-lyrical-arm64.tar.gz` from this release. That archive is attached by the rootfs job when the image build finishes.

  rootfs:
    name: Build Lyrical Rootfs
    runs-on: ubuntu-latest
    needs: build-release
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu 26.04 + ROS 2 Lyrical rootfs
        working-directory: rosdroid_app/rootfs_builder
        run: ./build_rootfs.sh

      - name: Attach rootfs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: rosdroid_app/rootfs_builder/rosdroid-ubuntu26-lyrical-arm64.tar.gz
